<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CRAZY ARCADE MASTER SCREEN</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body {
            background: #0f172a; color: #fff; padding: 20px; padding-bottom: 40px;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative;
        }

        .ca-container { display: flex; gap: 20px; flex: 1; margin-top: 15px; overflow: hidden; margin-bottom: 10px; }

        .user-grid {
            flex: 3; background: #1e293b; border: 4px solid #38bdf8; border-radius: 16px;
            padding: 20px; display: grid; grid-template-columns: repeat( auto-fill, minmax(140px, 1fr) );
            gap: 15px; align-content: start; overflow-y: auto;
        }

        .user-card {
            background: #334155; border: 3px solid #64748b; border-radius: 14px;
            padding: 12px 8px; text-align: center; position: relative; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .user-card.dead {
            filter: grayscale(100%); background: #0f172a; border-color: #ef4444; opacity: 0.5;
        }
        .user-card.dead::after {
            content: "☠️ 탈락 ㅠ.ㅠ"; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(220, 38, 38, 0.95);
            color: #fff; font-size: 13px; font-weight: 900; padding: 6px 10px; border-radius: 8px; width: 85%;
        }

        .avatar { font-size: 45px; line-height: 1.1; margin: 2px 0; }
        .nickname { font-size: 14px; font-weight: 900; color: #f8fafc; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .choice-badge { font-size: 22px; background: #0f172a; border-radius: 8px; padding: 2px 8px; margin-top: 6px; border: 1px solid #475569; }

        .chat-bubble {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
            background: #facc15; color: #000; font-size: 15px; font-weight: 900;
            padding: 6px 12px; border-radius: 12px; white-space: nowrap;
            border: 3px solid #000; box-shadow: 0 5px 15px rgba(0,0,0,0.8); z-index: 20;
        }

        .right-panel { flex: 1.2; display: flex; flex-direction: column; gap: 15px; }

        .ai-card { background: #1e293b; border: 4px solid #f43f5e; border-radius: 16px; padding: 20px; text-align: center; }
        
        .ai-hand-large { 
            font-size: 85px; background: #0f172a; border-radius: 15px; border: 2px solid #f43f5e; 
            margin: 12px 0; padding: 10px; height: 140px; display: flex; align-items: center; justify-content: center;
        }

        /* 관리자 화면 AI 로봇 캐릭터 이미지 스타일 */
        .admin-ai-img {
            max-height: 110px;
            object-fit: contain;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .timer-card {
            background: #1e293b; border: 4px solid #eab308; border-radius: 16px;
            padding: 15px; text-align: center; color: #facc15;
        }
        .timer-val { font-size: 40px; font-weight: 900; font-family: 'Press Start 2P'; margin-top: 5px; }

        .stat-card {
            background: #1e293b; border: 4px solid #10b981; border-radius: 16px;
            padding: 20px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center;
        }
        .stat-number { font-size: 32px; font-weight: 900; color: #10b981; margin-top: 8px; }

        .notice-banner {
            background: #f59e0b; color: #000; font-size: 18px; font-weight: 900;
            padding: 10px; text-align: center; border-radius: 10px; margin-top: 10px; display: none;
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 12px; }
        .btn-ctrl { padding: 12px 20px; font-size: 15px; font-weight: 900; border: none; border-radius: 8px; cursor: pointer; color: #fff; }
        .btn-next { background: #0284c7; }
        .btn-result { background: #f43f5e; }
        .btn-reset { background: #475569; font-size: 12px; }

        .winner-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }

        .winner-card {
            background: #1e293b; border: 6px solid #facc15; border-radius: 24px;
            padding: 40px 60px; text-align: center; box-shadow: 0 0 50px rgba(250, 204, 21, 0.6);
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes zoomIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .winner-avatar { font-size: 100px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }

        .winner-name { font-size: 42px; font-weight: 900; color: #facc15; margin: 15px 0; text-shadow: 0 0 20px rgba(250, 204, 21, 0.8); }

        .admin-footer-logo {
            text-align: center; font-size: 16px; font-weight: 900;
            color: #38bdf8; letter-spacing: 3px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            padding-top: 5px; z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1 style="font-family:'Press Start 2P'; color:#facc15; font-size:18px;">👑 SURVIVAL STAGE (<span id="round-display">ROUND 1</span>)</h1>
        <div>
            <button class="btn-ctrl btn-next" onclick="startRound()">▶️ 라운드 시작</button>
            <button class="btn-ctrl btn-result" onclick="showResult()">⚡ AI 결과 공개</button>
            <button class="btn-ctrl btn-reset" onclick="resetGame()">🔄 전체 리셋</button>
        </div>
    </div>

    <div id="notice-banner" class="notice-banner"></div>

    <div class="ca-container">
        <div id="user-grid" class="user-grid"></div>

        <div class="right-panel">
            <div class="timer-card">
                <div style="font-size:14px; font-weight:bold;">LIMIT TIME</div>
                <div id="timer-display" class="timer-val">5s</div>
            </div>

            <div class="ai-card">
                <div style="font-size:14px; color:#94a3b8; font-weight:bold;">AI ROBOT CHOICE</div>
                <div id="ai-large" class="ai-hand-large">
                    <img src="ai-robot.png" alt="AI Robot" class="admin-ai-img">
                </div>
            </div>

            <div class="stat-card">
                <div style="font-size:16px; color:#94a3b8; font-weight:bold;">SURVIVAL STATUS</div>
                <div id="survival-text" class="stat-number">0명 중 0명 생존</div>
            </div>
        </div>
    </div>

    <div class="admin-footer-logo">모바일. CX인재개발실</div>

    <div id="winner-modal" class="winner-modal">
        <div class="winner-card">
            <div style="font-family:'Press Start 2P'; color:#38bdf8; font-size:20px;">FINAL CHAMPION</div>
            <div id="winner-avatar" class="winner-avatar">👑</div>
            <div id="winner-name" class="winner-name">우승자 닉네임</div>
            <div style="font-size:22px; color:#10b981; font-weight:900;">🎉 최후의 1인 우승을 축하합니다! 🎉</div>
            <div style="margin-top:20px; font-size:14px; color:#94a3b8; font-weight:bold;">모바일. CX인재개발실</div>
        </div>
    </div>

    <script>
        const socket = io();
        const iconMap = { '가위': '✌️', '바위': '✊', '보': '🖐️', '미제출': '⏰' };
        const aiDefaultHTML = '<img src="ai-robot.png" alt="AI Robot" class="admin-ai-img">';
        let confettiInterval = null;

        function startRound() { 
            closeWinnerModal();
            document.getElementById('notice-banner').style.display = 'none';
            socket.emit('startRound'); 
        }
        function showResult() {
            const rps = ['가위', '바위', '보'];
            const aiChoice = rps[Math.floor(Math.random() * rps.length)];
            socket.emit('showResult', aiChoice);
        }
        function resetGame() {
            if(confirm('전체 리셋하시겠습니까?')) {
                closeWinnerModal();
                document.getElementById('notice-banner').style.display = 'none';
                socket.emit('resetGame');
            }
        }

        function closeWinnerModal() {
            document.getElementById('winner-modal').style.display = 'none';
            if (confettiInterval) clearInterval(confettiInterval);
        }

        function startContinuousConfetti() {
            if (confettiInterval) clearInterval(confettiInterval);
            confettiInterval = setInterval(() => {
                confetti({
                    particleCount: 80,
                    spread: 100,
                    origin: { x: Math.random(), y: Math.random() - 0.2 }
                });
            }, 400);
        }

        socket.on('updatePlayers', (data) => { renderScreen(data.players, data.round); });

        socket.on('roundStarted', (data) => {
            document.getElementById('ai-large').innerHTML = aiDefaultHTML;
            document.getElementById('round-display').innerText = `ROUND ${data.round}`;
            document.getElementById('timer-display').innerText = `${data.timeLeft}s`;
        });

        socket.on('timerUpdate', (data) => {
            document.getElementById('timer-display').innerText = `${data.timeLeft}s`;
        });

        socket.on('roundResult', (data) => {
            document.getElementById('ai-large').innerText = iconMap[data.aiChoice] || '🤖';
            renderScreen(data.players, data.round);

            const banner = document.getElementById('notice-banner');

            if (data.isWinnerFound) {
                let winner = data.players.find(p => p.isAlive);
                if (winner) {
                    document.getElementById('winner-avatar').innerText = winner.avatar || '👑';
                    document.getElementById('winner-name').innerText = winner.nickname;
                    document.getElementById('winner-modal').style.display = 'flex';
                    startContinuousConfetti();
                }
            } else if (data.isRevived) {
                banner.style.display = 'block';
                banner.style.background = '#f59e0b';
                banner.style.color = '#000';
                banner.innerText = "🔥 전원 탈락 발생! 직전 생존자 그룹이 자동으로 패자부활되었습니다!";
            }
        });

        socket.on('gameReset', (data) => {
            document.getElementById('ai-large').innerHTML = aiDefaultHTML;
            document.getElementById('timer-display').innerText = "5s";
            renderScreen(data.players, data.round);
        });

        function renderScreen(players, round) {
            document.getElementById('round-display').innerText = `ROUND ${round}`;
            const grid = document.getElementById('user-grid');
            grid.innerHTML = "";

            let total = players.length;
            let alive = players.filter(p => p.isAlive).length;
            document.getElementById('survival-text').innerText = `${total}명 중 ${alive}명 생존!`;

            players.forEach(p => {
                let cardClass = p.isAlive ? "user-card" : "user-card dead";
                let choiceIcon = p.choice ? iconMap[p.choice] : "❓";
                let chatBubble = p.chat ? `<div class="chat-bubble">💬 ${p.chat}</div>` : "";

                grid.innerHTML += `
                    <div class="${cardClass}">
                        ${chatBubble}
                        <div class="avatar">${p.avatar || '🐣'}</div>
                        <div class="nickname">${p.nickname}</div>
                        <div class="choice-badge">${p.isAlive ? choiceIcon : (p.choice === '미제출' ? '⏰' : '-')}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
